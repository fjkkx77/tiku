<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>刷题合集</title>
<style>
  /* 外观＝2026-10-15 之前的样子（2026-10-16 用户看过 iOS 风格改版后决定回到原来的界面风格，只保留新的逻辑和交互） */
  :root{ --primary:#3b82f6; --primary-dark:#2563eb; --bg:#f3f4f6; --text:#1f2937; --muted:#6b7280; --border:#e5e7eb; --danger:#dc2626; --press:#eef2f7; --ease:cubic-bezier(.2,.9,.3,1); }
  *{box-sizing:border-box;}
  [hidden]{display:none!important;}
  body{margin:0;font-family:"Microsoft YaHei",Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;}
  .app{max-width:760px;margin:0 auto;min-height:100vh;padding:0 14px;}
  header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:28px 16px;text-align:center;margin:0 -14px 16px;border-radius:0 0 16px 16px;position:relative;}
  header h1{margin:0;font-size:22px;}
  header p{margin:6px 0 0;font-size:13px;opacity:.85;}
  .list{display:flex;flex-direction:column;gap:12px;}
  .item{display:block;background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);text-decoration:none;color:var(--text);position:relative;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:background-color .3s;}
  .item.pressed{background:var(--press);transition:none;}   /* 按下反馈：轻轻变灰，松手淡出 */
  .item .name-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
  .item .name{font-size:17px;font-weight:bold;min-width:0;overflow-wrap:anywhere;}
  .item .desc{font-size:13px;color:var(--muted);}
  .item .desc b{color:var(--text);}
  .pin-tag{font-size:13px;flex-shrink:0;}
  .empty-note{font-size:12px;color:var(--muted);text-align:center;margin-top:24px;}

  /* 卡片上的按钮可点，其余部分点了＝进入科目 */
  .name-row{pointer-events:none;}
  .icon-btn,.reset-btn{pointer-events:auto;}

  /* 通用小图标按钮（重命名/移入文件夹/文件夹改名/删除文件夹），始终可见，触屏友好 */
  .icon-btn{
    background:none;border:none;cursor:pointer;
    min-width:36px;min-height:36px;
    display:inline-flex;align-items:center;justify-content:center;
    border-radius:6px;
    color:var(--muted);font-size:14px;line-height:1;
    flex-shrink:0;opacity:.6;touch-action:manipulation;
  }
  @media (hover:hover) and (pointer:fine) {
    .icon-btn:hover{color:var(--primary);background:#e0edff;opacity:1;}
    .icon-btn.danger:hover{color:#ef4444;background:#fee2e2;}
  }
  .icon-btn:active{color:var(--primary);background:#e0edff;opacity:1;}
  .icon-btn.danger:active{color:#ef4444;background:#fee2e2;}
  /* 移入文件夹图标固定放在卡片这一行的最右端，跟名字/改名图标分开 */
  .name-row .folder-btn{margin-left:auto;}

  /* 重置按钮（已自定义名称时显示，不再依赖hover，触屏可直接点到） */
  .reset-btn{
    display:none;
    background:none;border:none;cursor:pointer;
    padding:2px 5px;border-radius:4px;
    color:#ef4444;font-size:11px;line-height:1.4;
    flex-shrink:0;margin-left:2px;opacity:.75;touch-action:manipulation;position:relative;
  }
  .reset-btn::after{content:"";position:absolute;left:-6px;right:-6px;top:-12px;bottom:-12px;}   /* 看起来不变，可点范围撑大 */
  @media (hover:hover) and (pointer:fine) {
    .reset-btn:hover{background:#fee2e2;opacity:1;}
  }
  .reset-btn:active{background:#fee2e2;opacity:1;}
  .reset-btn.visible{display:inline-flex;}

  /* 文件夹卡片 */
  .folder-card{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .folder-header{display:flex;align-items:center;gap:6px;padding:14px 16px;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  .folder-header .chevron{font-size:11px;color:var(--muted);width:14px;flex-shrink:0;transition:transform .25s var(--ease);}
  .folder-card.open .folder-header .chevron{transform:rotate(90deg);}
  .folder-header .folder-icon{font-size:16px;flex-shrink:0;}
  .folder-header .folder-name{
    font-size:16px;font-weight:bold;
    min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .folder-header .folder-count{font-size:13px;color:var(--muted);flex-shrink:0;}
  .folder-header .icon-btn:first-of-type{margin-left:auto;}
  .folder-fold{overflow:hidden;border-radius:0 0 10px 10px;}
  .folder-body{display:flex;flex-direction:column;gap:10px;padding:10px 12px 14px;background:#f8f9fb;border-radius:0 0 10px 10px;position:relative;}
  .folder-body .item{border:1px solid var(--border);}
  .folder-empty-note{font-size:12px;color:var(--muted);text-align:center;padding:10px 0;}

  /* 主界面顶部的"新建文件夹"入口 */
  .new-folder-row{margin:14px 0 2px;min-height:32px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;}
  .new-folder-link{
    font-size:13px;color:var(--primary-dark);font-weight:bold;cursor:pointer;
    display:inline-flex;align-items:center;gap:4px;padding:6px 4px;touch-action:manipulation;
  }

  /* 头部右边的 ⋯（替掉原来的「批量整理」按钮，用户 2026-10-16 圈定保留）：钉在标题栏右侧，标题/副标题仍真正居中 */
  .top-more{position:absolute;right:8px;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:22px;border:0;padding:0;
    display:flex;align-items:center;justify-content:center;color:#fff;background:transparent;cursor:pointer;touch-action:manipulation;}
  .top-more span{width:34px;height:34px;border-radius:17px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;transition:background .15s;}
  .top-more:active span,.top-more[aria-expanded="true"] span{background:rgba(255,255,255,.34);}
  @media (hover:hover) and (pointer:fine){ .top-more:hover span{background:rgba(255,255,255,.3);} }
  header p{padding:0 40px;}
  /* ⋯ 菜单 */
  .menu-mask{position:fixed;inset:0;z-index:40;}
  .menu{position:absolute;z-index:41;width:220px;background:#fff;border-radius:12px;box-shadow:0 10px 36px rgba(0,0,0,.2),0 0 0 .5px rgba(0,0,0,.06);overflow:hidden;
    transform-origin:top right;animation:menuIn .24s var(--ease);}
  @keyframes menuIn{from{opacity:0;transform:scale(.6);}to{opacity:1;transform:none;}}
  .menu .it{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;padding:0 16px;border:0;background:none;font-size:15px;color:var(--text);text-align:left;font-family:inherit;cursor:pointer;}
  .menu .it + .it{border-top:1px solid var(--border);}
  .menu .it svg{color:var(--muted);}
  .menu .it:active{background:#f3f4f6;}
  .menu .gap{height:6px;background:#f3f4f6;}

  .item.batch-active .icon-btn,.item.batch-active .reset-btn{display:none !important;}
  .item.batch-selected{border:2px solid var(--primary);background:#eef2ff;}
  .folder-card.batch-active .icon-btn{display:none !important;}

  .batch-checkbox{
    width:20px;height:20px;border:2px solid var(--border);border-radius:5px;
    flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:13px;color:#fff;margin-right:2px;
  }
  .batch-checkbox.checked{background:var(--primary);border-color:var(--primary);}

  .batch-bar{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(16px + env(safe-area-inset-bottom));
    max-width:730px;width:calc(100% - 28px);
    background:#1f2937;color:#fff;border-radius:12px;padding:12px 16px;
    display:none;align-items:center;justify-content:space-between;gap:10px;
    box-shadow:0 4px 20px rgba(0,0,0,.25);z-index:30;
  }
  .batch-bar-btn{
    background:#fff;color:#1f2937;border:none;border-radius:8px;
    padding:9px 14px;font-size:13px;font-weight:bold;cursor:pointer;touch-action:manipulation;
    min-height:36px;
  }
  .batch-bar-btn.cancel{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);}
  .batch-bar-btn:disabled{opacity:.45;cursor:not-allowed;}
  /* 批量整理时底部浮着操作条：给页面底部留出它的高度，最后一张卡片才不会被挡住 */
  body.batch-on .app{padding-bottom:calc(96px + env(safe-area-inset-bottom));}

  /* 左滑露出的操作（存档组件的淡色调按钮，圆角跟卡片一样） */
  .lsw-item{touch-action:pan-y pinch-zoom;}
  .lsw-anim{transition:transform .3s var(--ease)!important;}
  /* 用户 2026-10-16 在对比图上圈定保留的样子：灰「更多」+ 蓝「置顶」实色块，并排、右端圆角跟卡片一样（白字对比度 灰 4.8:1、蓝 5.2:1） */
  .lsw-acts{position:absolute;display:flex;pointer-events:none;border-radius:0 10px 10px 0;overflow:hidden;}
  .lsw-acts.is-open{pointer-events:auto;}
  .lsw-btn{width:72px;height:100%;border:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:bold;font-family:inherit;color:#fff;cursor:pointer;}
  .lsw-btn svg{width:20px;height:20px;}
  .lsw-more{background:var(--muted);}
  .lsw-pin{background:var(--primary-dark);}
  .lsw-btn:active{filter:brightness(.94);}

  /* 长按拖动排序（assets/drag.js 配套样式） */
  body.dragging{user-select:none;-webkit-user-select:none;touch-action:none;}
  body.dragging .folder-fold{overflow:visible;}
  .drag-sliding{transition:transform .18s cubic-bezier(.2,.8,.3,1);}
  .drag-lift{transition:none!important;z-index:50;position:relative;box-shadow:0 12px 28px rgba(17,24,39,.22)!important;}
  .drag-landing{z-index:50;position:relative;}
  body.just-dragged .item,body.just-dragged .folder-header{pointer-events:none;}

  /* 底部面板（重命名 / 移到文件夹 / 新建文件夹），能下拉关闭 */
  .mask{position:fixed;inset:0;z-index:60;background:rgba(12,16,22,.42);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:0;}}
  .sheet{position:relative;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:16px 16px 0 0;
    padding:22px 14px calc(14px + env(safe-area-inset-bottom));overscroll-behavior:contain;animation:sheetUp .32s var(--ease);}
  @keyframes sheetUp{from{transform:translateY(100%);}}
  .sheet::before{content:"";position:absolute;top:7px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:#9ca3af;opacity:.5;}
  @media (min-width:560px){ .mask{align-items:center;padding:20px;} .sheet{border-radius:14px;animation:pop .2s var(--ease);} .sheet::before{display:none;} }
  @keyframes pop{from{opacity:0;transform:scale(.94);}}
  .sheet h2{margin:0 4px 4px;font-size:16px;text-align:center;}
  .sheet .sub{margin:0 4px 10px;font-size:13px;color:var(--muted);text-align:center;}
  .sheet .opts{background:#fff;border-radius:10px;overflow:hidden;margin-top:12px;}
  .sheet .opt{width:100%;display:flex;align-items:center;gap:12px;min-height:50px;padding:0 16px;border:0;background:#fff;font-size:16px;color:var(--text);text-align:left;position:relative;font-family:inherit;cursor:pointer;}
  .sheet .opt + .opt::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--border);}
  .sheet .opt:active{background:#f3f4f6;}
  .sheet .opt .lb{flex:1;min-width:0;overflow-wrap:anywhere;}
  .sheet .opt .ic{color:var(--muted);flex:0 0 auto;display:flex;}
  .sheet .opt.danger{color:#ef4444;}
  .sheet .opt.danger .ic{color:#ef4444;}
  .sheet .opt.on{color:var(--primary-dark);font-weight:bold;}
  .sheet .opt.on .ic{color:var(--primary-dark);}
  .sheet .cancel{width:100%;margin-top:10px;min-height:50px;border:0;border-radius:10px;background:#fff;font-size:16px;font-weight:bold;color:var(--primary-dark);font-family:inherit;cursor:pointer;}
  .sheet .cancel:active{background:#f3f4f6;}
  .sheet .field{margin-top:12px;position:relative;}
  .sheet input[type=text]{width:100%;min-height:48px;border:1.5px solid var(--border);border-radius:8px;background:#fff;padding:0 44px 0 12px;font-size:16px;color:var(--text);outline:none;font-family:inherit;}
  .sheet input[type=text]:focus{border-color:var(--primary);}
  .sheet .clear{position:absolute;right:4px;top:50%;margin-top:-20px;width:40px;height:40px;border:0;background:none;color:#9ca3af;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .sheet .btns{display:flex;gap:10px;margin-top:14px;}
  .sheet .btns button{flex:1;min-height:46px;border:0;border-radius:8px;font-size:15px;font-weight:bold;font-family:inherit;cursor:pointer;}
  .sheet .btns .b2{background:#fff;color:var(--muted);}
  .sheet .btns .b1{background:var(--primary);color:#fff;}
  .sheet .btns .b1:disabled{opacity:.45;cursor:not-allowed;}
  .sheet .btns button:active{filter:brightness(.93);}

  /* 自定义确认弹窗（和科目站同款）：原生 confirm() 的样子由浏览器/微信内核决定，各设备不一致 */
  .confirm-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;}
  .confirm-backdrop.show{display:flex;}
  .confirm-box{background:#fff;border-radius:14px;max-width:320px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden;animation:confirmPop .15s ease;}
  @keyframes confirmPop{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}
  .confirm-msg{padding:22px 20px 18px;font-size:15px;line-height:1.7;color:var(--text);white-space:pre-wrap;text-align:center;}
  .confirm-btns{display:flex;border-top:1px solid var(--border);}
  .confirm-btns button{flex:1;border:none;background:none;padding:13px 0;font-size:16px;cursor:pointer;font-family:inherit;}
  .confirm-btns .confirm-cancel{color:var(--muted);border-right:1px solid var(--border);}
  .confirm-btns .confirm-ok{color:var(--primary-dark);font-weight:bold;}
  .confirm-btns .confirm-ok.danger{color:#ef4444;}
  /* ===================== 下拉刷新 ===================== */
  /* 先关掉浏览器自带的下拉刷新，否则会和自研的这套同时触发 */
  html,body{overscroll-behavior-y:contain;}
  #ptrIndicator{
    position:fixed;top:calc(-44px + env(safe-area-inset-top,0px));left:50%;margin-left:-18px;
    width:36px;height:36px;border-radius:50%;
    background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18);
    display:flex;align-items:center;justify-content:center;
    color:var(--primary-dark);opacity:0;pointer-events:none;z-index:200;
  }
  /* 跟手过程中必须关掉过渡，只在松手回弹时开，否则拖泥带水 */
  #ptrIndicator.ptr-animate{transition:transform .25s ease,opacity .25s ease;}
  #ptrIndicator svg{width:20px;height:20px;}
  #ptrIndicator .ptr-arrow{transition:transform .2s ease;}
  #ptrIndicator.ptr-ready .ptr-arrow{transform:rotate(180deg);}
  #ptrIndicator .ptr-spinner{display:none;}
  #ptrIndicator.ptr-loading .ptr-arrow{display:none;}
  #ptrIndicator.ptr-loading .ptr-spinner{display:block;animation:ptr-spin .8s linear infinite;}
  @keyframes ptr-spin{to{transform:rotate(360deg);}}
  #ptrTip{
    position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);
    width:max-content;max-width:80vw;text-align:center;
    background:rgba(31,41,55,.92);color:#fff;font-size:13px;line-height:1.5;
    padding:8px 14px;border-radius:999px;z-index:201;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  #ptrTip.show{opacity:1;}
  /* 备份 */
  .backup-row{display:flex;justify-content:center;gap:28px;margin-top:22px;}
  .backup-link{font-size:13px;color:var(--primary-dark);font-weight:bold;cursor:pointer;padding:12px 8px;margin:-12px -8px;touch-action:manipulation;}
  .backup-note{font-size:12px;color:var(--muted);text-align:center;line-height:1.7;margin:10px auto 28px;max-width:520px;}
  [role="button"]:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
  button,input{font-family:inherit;}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}
  }
</style>
</head>
<body>
<div id="ptrIndicator">
  <svg class="ptr-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
  <svg class="ptr-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
</div>
<div id="ptrTip"></div>
<div class="app">
  <header>
    <h1>刷题合集</h1>
    <p>各科目练习题网站入口 · 持续更新</p>
    <button class="top-more" id="topMoreBtn" type="button" aria-label="更多操作" aria-haspopup="menu" aria-expanded="false"><span></span></button>
  </header>
  <div class="list" id="list"></div>
  <div class="empty-note">以后新增科目会持续加在这里 · 左滑科目可置顶，长按可拖动排序</div>
  <div class="backup-row">
    <span class="backup-link" id="exportBtn" role="button" tabindex="0">⬇ 导出备份</span>
    <span class="backup-link" id="importBtn" role="button" tabindex="0">⬆ 导入备份</span>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
  <div class="backup-note"><span id="lastExport">上次导出：从未</span>。错题本和练习记录只存在这台设备的这个浏览器里：清一次浏览器数据、或很久没打开，都可能全没。<br>隔一阵点一下「导出备份」，存下的那个文件可以在任何设备上「导入」回来（导入是合并，不会冲掉已有的）。</div>
</div>

<div class="batch-bar" id="batchBar">
  <span id="batchCount"></span>
  <div style="display:flex;gap:8px;">
    <button class="batch-bar-btn" id="batchMoveBtn" type="button">移动到文件夹 ▾</button>
    <button class="batch-bar-btn cancel" id="batchCancelBtn" type="button">取消</button>
  </div>
</div>

<div class="confirm-backdrop" id="confirmBackdrop">
  <div class="confirm-box" role="alertdialog" aria-modal="true">
    <div class="confirm-msg" id="confirmMsg"></div>
    <div class="confirm-btns">
      <button class="confirm-cancel" id="confirmCancelBtn" type="button">取消</button>
      <button class="confirm-ok" id="confirmOkBtn" type="button">确定</button>
    </div>
  </div>
</div>

<script src="assets/drag.js?v=2.0.0"></script>
<script>
const SUBJECTS = [
  { key:'web-design', prefix:'webquiz',         href:'./web-design/',          defaultName:'WEB程序设计',           total:90,  desc:'单选+填空混合，90题 · 错题本 / 练习记录 / 题目总览' },
  { key:'os', prefix:'osquiz',                 href:'./os/',                  defaultName:'操作系统',               total:85,  desc:'填空题，85题 · 错题本 / 练习记录 / 题目总览' },
  { key:'software-engineering', prefix:'rjgcquiz',href:'./software-engineering/',defaultName:'软件工程',              total:156, desc:'单选+填空混合，156题（6章节填空+6套模拟题） · 错题本 / 练习记录 / 题目总览' },
  { key:'mobile-app', prefix:'mobileappquiz',         href:'./mobile-app/',          defaultName:'移动应用开发',           total:10,  desc:'单选题，10题（第1次+第2次作业） · 错题本 / 练习记录 / 题目总览' },
  { key:'english-listening', prefix:'listeningquiz',  href:'./english-listening/',   defaultName:'大学英语听力',           total:120, desc:'单选题，120题（六单元各20题） · 错题本 / 练习记录 / 题目总览' },
  { key:'english-reading', prefix:'engreadingquiz',    href:'./english-reading/',     defaultName:'大学英语阅读与选词填空', total:66,  desc:'填空+单选混合，66题（六单元：选词填空6篇每篇10空＋阅读理解60题） · 错题本 / 练习记录 / 题目总览' },

/* ===================== 存储 ===================== */
// 存储里的东西不一定是我们写的样子（被别的页面写坏了、浏览器禁用了存储）：读出来不对就当成空的，别让整页打不开
function readObj(key) {
  try { const v = JSON.parse(localStorage.getItem(key) || '{}'); return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {}; } catch(e) { return {}; }
}
function readList(key) {
  try { const v = JSON.parse(localStorage.getItem(key) || '[]'); return Array.isArray(v) ? v.filter(function(x){ return x && typeof x === 'object' && x.id && typeof x.name === 'string'; }) : []; } catch(e) { return []; }
}
// 科目 key 列表：只留认识的、去重
function readKeys(key) {
  let v = []; try { v = JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) {}
  if (!Array.isArray(v)) return [];
  const seen = {};
  return v.filter(function(k){ if (typeof k !== 'string' || !SUBJ_BY_KEY[k] || seen[k]) return false; seen[k] = 1; return true; });
}
// 写不进去（空间满了 / 存储被禁用）必须让人知道
function safeSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e) { notify('浏览器存不进数据了（空间已满或存储被禁用），这次改动没有保存'); return false; }
}
let notifyTimer = null;
function notify(msg) {
  const tip = $('ptrTip');
  if (!tip) return;
  tip.textContent = msg;
  tip.classList.add('show');
  clearTimeout(notifyTimer);
  notifyTimer = setTimeout(function(){ tip.classList.remove('show'); }, 3200);
}
function loadNames() { return readObj(STORAGE_KEY); }
function saveName(key, name) { const names = loadNames(); names[key] = name; safeSet(STORAGE_KEY, names); }
function deleteName(key) { const names = loadNames(); delete names[key]; safeSet(STORAGE_KEY, names); }
function loadFolders() {
  const seen = {};
  return readList(FOLDERS_KEY).filter(function(f){ if (seen[f.id]) return false; seen[f.id] = 1; return true; });
}
function saveFolders(folders) { return safeSet(FOLDERS_KEY, folders); }
function loadSubjectFolderMap() { return readObj(SUBJECT_FOLDER_KEY); }
function saveSubjectFolderMap(map) { return safeSet(SUBJECT_FOLDER_KEY, map); }
function loadPinned() { return readKeys(PINNED_KEY); }
function savePinned(keys) { return safeSet(PINNED_KEY, keys); }
function loadOrder() {
  const keys = readKeys(ORDER_KEY);
  SUBJECTS.forEach(function(s){ if (keys.indexOf(s.key) < 0) keys.push(s.key); });
  return keys;
}
// 同一层的几科换了先后：它们原来在总顺序里占着哪些位置，就按新顺序填回这些位置；别的科目不动
function reorderSubjects(keys) {
  const order = loadOrder(), slots = [];
  order.forEach(function(k, i){ if (keys.indexOf(k) >= 0) slots.push(i); });
  slots.forEach(function(pos, i){ order[pos] = keys[i]; });
  return safeSet(ORDER_KEY, order);
}
function displayName(key, names) { return (names || loadNames())[key] || SUBJ_BY_KEY[key].defaultName; }

// 一科的学习情况：错题数、做过几题（读科目站自己存的数据，只读不写）
function readJSON(key, def) { try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? def : v; } catch(e) { return def; } }
function subjectStats(s) {
  const wb = readJSON(s.prefix + '_wrongbook', {}), done = readJSON(s.prefix + '_done', {});
  const wrong = (wb && typeof wb === 'object' && !Array.isArray(wb)) ? Object.keys(wb).length : 0;
  let d = (done && typeof done === 'object' && !Array.isArray(done)) ? Object.keys(done).length : 0;
  if (d > s.total) d = s.total;   // 题库删过题时旧记录会多出来
  return { wrong: wrong, done: d, total: s.total };
}
function statsText(st) {
  if (!st.done && !st.wrong) return '还没练过 · 共 ' + st.total + ' 题';
  return (st.wrong ? '错题 <b>' + st.wrong + '</b>' : '没有错题') + ' · 已做 ' + st.done + '/' + st.total;
}

/* ===================== 画列表 ===================== */
let renderPending = false;
function esc(s) { return String(s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
// 卡片第二行：原来的「题型，N题」后面接学习情况（原来那句「错题本 / 练习记录 / 题目总览」每张卡都一样，换成这科自己的数）
function descHtml(s, st) {
  const base = s.desc.replace(/\s*·\s*错题本 \/ 练习记录 \/ 题目总览\s*$/, '');
  const tail = (!st.done && !st.wrong) ? '还没练过' : (st.wrong ? '错题 <b>' + st.wrong + '</b>' : '没有错题') + ' · 已做 ' + st.done;
  return esc(base) + ' · ' + tail;
}

function render() {
  if (drag && drag.active()) { renderPending = true; return; }   // 拖动中别重画：手里那一张会被换掉
  if (drag && drag.holding()) drag.cancelHold();                   // 正按住等拿起：旧的那一张马上就不在页面上了

  const fids = {}; folders.forEach(function(f){ fids[f.id] = 1; });
  const inFolder = {}, loose = [];
  order.forEach(function(k){
    if (pinned.indexOf(k) >= 0) return;
    const fid = map[k];
    if (fid && fids[fid]) (inFolder[fid] = inFolder[fid] || []).push(k);
    else loose.push(k);
  });

  function card(k, isPinned) {
    const s = SUBJ_BY_KEY[k], custom = !!names[k], sel = batchMode && selected.has(k);
    return '<a class="item lsw-item' + (isPinned ? ' pinned' : '') + (batchMode ? ' batch-active' : '') + (sel ? ' batch-selected' : '') + '" href="' + s.href + '" data-key="' + k + '" data-k="r:' + k + '">'

      + '<span class="name">' + esc(displayName(k, names)) + '</span>'

      + '<button class="icon-btn folder-btn" type="button" title="移入文件夹">📁</button>'
      + '</div><div class="desc">' + descHtml(s, subjectStats(s)) + '</div></a>';
  }
  let h = pinned.map(function(k){ return card(k, true); }).join('');
  folders.forEach(function(f){
    const ks = inFolder[f.id] || [], open = expandedFolders.has(f.id);
    h += '<div class="folder-card' + (open ? ' open' : '') + (batchMode ? ' batch-active' : '') + '" data-fid="' + esc(f.id) + '" data-k="f:' + esc(f.id) + '">'
      + '<div class="folder-header" role="button" tabindex="0" aria-expanded="' + open + '">'
      + '<span class="chevron">▶</span><span class="folder-icon">📁</span><span class="folder-name">' + esc(f.name) + '</span><span class="folder-count">(' + ks.length + ')</span>'
      + '<button class="icon-btn folder-rename" type="button" title="重命名文件夹">✏️</button>'
      + '<button class="icon-btn danger folder-delete" type="button" title="删除文件夹">🗑️</button></div>'
      + '<div class="folder-fold"' + (open ? '' : ' hidden') + '><div class="folder-body">'
      + (ks.length ? ks.map(function(k){ return card(k, false); }).join('') : '<div class="folder-empty-note">空文件夹，从科目卡片的📁按钮把科目移进来</div>')
      + '</div></div></div>';
  });
  h += loose.map(function(k){ return card(k, false); }).join('');
  $('list').innerHTML = h;

}

/* 变化要有过渡：重画前记下每一块的位置，重画后从旧位置滑到新位置（FLIP）；新出现的淡入。
   文件夹卡片和科目卡片都带 data-k；文件夹里的卡片在文件夹自己移动时只补「相对文件夹」的那一段，否则会走双倍距离 */
function flip(change) {
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const before = {};
  const visible = function(n){ return n.offsetParent !== null; };   // 收起的文件夹里的卡片量不到位置，不参与
  if (!reduce) document.querySelectorAll('#list [data-k]').forEach(function(n){ if (visible(n)) before[n.dataset.k] = n.getBoundingClientRect().top; });
  change();
  if (reduce || !document.body.animate) return;
  const moved = new Map();
  const anim = function(n, d){ if (Math.abs(d) >= 1) n.animate([{ transform: 'translateY(' + d + 'px)' }, { transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.2,.9,.3,1)' }); };
  document.querySelectorAll('#list .folder-card[data-k]').forEach(function(n){
    const b = before[n.dataset.k];
    if (b === undefined) { n.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260, easing: 'ease' }); moved.set(n, 0); return; }
    const d = b - n.getBoundingClientRect().top; moved.set(n, d); anim(n, d);
  });
  document.querySelectorAll('#list .item[data-k]').forEach(function(n){
    if (!visible(n)) return;
    const b = before[n.dataset.k], fc = n.closest('.folder-card'), ds = fc ? (moved.get(fc) || 0) : 0;
    if (b === undefined) { n.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260, easing: 'ease' }); return; }
    anim(n, b - n.getBoundingClientRect().top - ds);
  });
}

/* 展开 / 收起文件夹：原地切换 + 高度动画（不整块重画，下面的卡片跟着平滑移动） */
function toggleFolder(card) {
  const fid = card.dataset.fid, open = !expandedFolders.has(fid);
  setExpanded(fid, open);
  const fold = card.querySelector('.folder-fold');
  card.classList.toggle('open', open);
  card.querySelector('.folder-header').setAttribute('aria-expanded', String(open));
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || !fold.animate) { fold.hidden = !open; return; }
  if (fold.__anim) fold.__anim.cancel();
  fold.hidden = false;
  const full = fold.scrollHeight;
  const a = fold.animate([{ height: (open ? 0 : full) + 'px' }, { height: (open ? full : 0) + 'px' }], { duration: 320, easing: 'cubic-bezier(.2,.9,.3,1)' });
  fold.__anim = a;
  a.onfinish = function(){ fold.__anim = null; fold.hidden = !expandedFolders.has(fid); };
}

// 按下反馈：按下（不是在滚动）就整张卡轻轻变灰，松手淡出
let pressTimer = 0, pressEl = null, pressXY = null;
function clearPress() { clearTimeout(pressTimer); pressTimer = 0; if (pressEl) pressEl.classList.remove('pressed'); pressEl = null; }
document.addEventListener('pointerdown', function(e){
  clearPress();
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const r = e.target.closest('#list .item');
  if (!r || e.target.closest('button') || anyOverlay() || (swipe && swipe.isOpen())) return;
  pressEl = r; pressXY = [e.clientX, e.clientY];
  pressTimer = setTimeout(function(){ if (pressEl) pressEl.classList.add('pressed'); }, e.pointerType === 'touch' ? 70 : 0);
}, true);
document.addEventListener('pointermove', function(e){
  if (pressEl && pressXY && (Math.abs(e.clientX - pressXY[0]) > 8 || Math.abs(e.clientY - pressXY[1]) > 8)) clearPress();
}, { passive: true });
document.addEventListener('pointerup', function(){ const r = pressEl; clearTimeout(pressTimer); pressEl = null; if (r) setTimeout(function(){ r.classList.remove('pressed'); }, 90); }, true);
document.addEventListener('pointercancel', clearPress, true);
window.addEventListener('scroll', clearPress, { passive: true });

$('list').addEventListener('click', function(e){
  const btn = e.target.closest('button');
  const item = e.target.closest('.item[data-key]');
  const fc = e.target.closest('.folder-card[data-fid]');
  if (btn) {
    e.preventDefault(); e.stopPropagation();

      const k = item.dataset.key;
      if (btn.classList.contains('rename-btn')) renameSubject(k);
      else if (btn.classList.contains('folder-btn')) moveSheet([k]);
      else if (btn.classList.contains('reset-btn')) { deleteName(k); render(); }
    } else if (fc) {
      if (btn.classList.contains('folder-rename')) renameFolder(fc.dataset.fid);
      else if (btn.classList.contains('folder-delete')) deleteFolder(fc.dataset.fid);
    }
    return;
  }
  if (item) {
    if (!batchMode) return;   // 平时：<a> 自己跳进科目
    e.preventDefault();
    const k = item.dataset.key;
    if (selected.has(k)) selected.delete(k); else selected.add(k);

    item.classList.toggle('batch-selected', on);
    const cb = item.querySelector('.batch-checkbox'); cb.classList.toggle('checked', on); cb.textContent = on ? '✓' : '';

// 电脑上右键（和键盘的菜单键）= 左滑里的「更多」；手机长按归拖动排序，这里不接
let lastTouch = 0;

$('list').addEventListener('contextmenu', function(e){

// 同一时间只开一个（HIG Sheets）；下拉可以关（SheetDismiss，存档组件 references/组件_iOS手势）
let sheetEl = null;
function closeSheet() {

// 输入面板：改名 / 新建分组。名字没变或为空时「完成」不可点；回车＝完成（输入法选字时不算）

  let input;

      + (o.hint ? '<p class="sub" style="margin-top:10px"></p>' : '') + '<div class="btns"><button class="b2" type="button">取消</button><button class="b1" type="button"></button></div>';

    sync();

function openSubjectSheet(key) {
  if (swipe) swipe.close(false);
  const names = loadNames(), name = displayName(key, names), custom = !!names[key];
  const map = loadSubjectFolderMap(), folders = loadFolders();
  const cur = folders.find(function(f){ return f.id === map[key]; });

  const items = [

    { label: '重命名', icon: ICON.pencil, id: 'actRename', onClick: function(){ renameSubject(key); } },
    { label: '移到文件夹…', icon: ICON.folder, id: 'actMove', onClick: function(){ moveSheet([key]); } },
  ];
  if (custom) items.push({ label: '还原原名「' + SUBJ_BY_KEY[key].defaultName + '」', icon: ICON.undo, id: 'actReset', onClick: function(){ deleteName(key); render(); notify('已还原成「' + SUBJ_BY_KEY[key].defaultName + '」'); } });
  actionSheet(name, cur ? '在「' + cur.name + '」文件夹里' : '', items);
}
function renameSubject(key) {
  const s = SUBJ_BY_KEY[key];
  inputSheet({ title: '重命名科目', value: displayName(key), placeholder: s.defaultName, hint: '改回「' + s.defaultName + '」或点卡片上的「还原」都能恢复原名',
    onOk: function(v){ if (v === s.defaultName) deleteName(key); else saveName(key, v); render(); } });
}
// 移到文件夹：卡片上的 📁、左滑「更多」、批量整理共用
function moveSheet(keys) {
  if (swipe) swipe.close(false);
  const folders = loadFolders(), map = loadSubjectFolderMap();
  const same = keys.every(function(k){ return map[k] === map[keys[0]]; }) ? map[keys[0]] : null;
  const anyIn = keys.some(function(k){ return map[k] && folders.some(function(f){ return f.id === map[k]; }); });
  const items = folders.map(function(f){
    return { label: f.name, icon: f.id === same ? ICON.checkB : ICON.folder, on: f.id === same, onClick: function(){ applyMove(keys, f.id); } };
  });
  if (anyIn) items.push({ label: '移出文件夹', icon: ICON.out, danger: true, id: 'actMoveOut', onClick: function(){ applyMove(keys, null); } });
  items.push({ label: '新建文件夹…', icon: ICON.plus, id: 'actMoveNew', onClick: function(){ promptNewFolder(keys); } });
  const n = keys.length;
  actionSheet(n === 1 ? '把「' + displayName(keys[0]) + '」移到' : '把 ' + n + ' 科移到', '', items);
}
function applyMove(keys, fid) {
  const map = loadSubjectFolderMap();
  keys.forEach(function(k){ if (fid) map[k] = fid; else delete map[k]; });
  if (!saveSubjectFolderMap(map)) return;
  if (fid) setExpanded(fid, true);
  if (batchMode) { batchMode = false; selected.clear(); renderToolbar(); }
  flip(render);
}
function promptNewFolder(keys) {
  inputSheet({ title: '新建文件夹', placeholder: '文件夹名称', okLabel: '创建', allowSame: true,
    onOk: function(v){
      const folders = loadFolders(), f = { id: newFolderId(), name: v };
      folders.push(f);
      if (!saveFolders(folders)) return;
      setExpanded(f.id, true);
      if (keys && keys.length) applyMove(keys, f.id); else flip(render);
    } });
}
function renameFolder(fid) {
  const f = loadFolders().find(function(x){ return x.id === fid; });
  if (!f) return;
  inputSheet({ title: '重命名文件夹', value: f.name, onOk: function(v){
    const fs = loadFolders(), t = fs.find(function(x){ return x.id === fid; }); if (!t) return;
    t.name = v; if (saveFolders(fs)) render(); } });
}
async function deleteFolder(fid) {
  const f = loadFolders().find(function(x){ return x.id === fid; });
  if (!f) return;
  if (!await showConfirm('确定要删除文件夹"' + f.name + '"吗？\n文件夹里的科目不会被删除，只会移回未分类列表。', '删除', true)) return;
  saveFolders(loadFolders().filter(function(x){ return x.id !== fid; }));
  const map = loadSubjectFolderMap();
  Object.keys(map).forEach(function(k){ if (map[k] === fid) delete map[k]; });
  saveSubjectFolderMap(map);
  setExpanded(fid, false);
  flip(render);
}
function togglePin(key) {
  const p = loadPinned(), i = p.indexOf(key);
  if (i >= 0) p.splice(i, 1); else p.push(key);
  if (!savePinned(p)) return;
  if (swipe) swipe.close(false);
  flip(render);
}

function SwipeActions(o){

    }
  }, true);

  function set(el, x, anim){
    el.classList.toggle("lsw-anim", !!anim);
    el.style.transform = x ? "translate3d(" + x.toFixed(1) + "px,0,0)" : "";
  }
  /* 按钮层只在滑动时临时插进 DOM（插在条目前面，靠 DOM 顺序被条目盖住），收回就拆掉——
     平时页面结构不变，别的依赖选择器的逻辑（拖拽排序、堆叠）都不用改 */

    var acts = document.createElement("div");
    acts.className = "lsw-acts";
    list.forEach(function(a){
      var b = document.createElement("button");
      b.type = "button"; b.className = "lsw-btn " + (a.cls || "");
      b.innerHTML = (a.icon || "") + '<span class="lsw-txt"></span>';
      b.querySelector(".lsw-txt").textContent = a.label;
      b.addEventListener("click", function(){ a.onClick(el); });
      acts.appendChild(b);
    });
    acts.style.top = el.offsetTop + "px";
    acts.style.height = el.offsetHeight + "px";
    acts.style.right = (host.clientWidth - el.offsetLeft - el.offsetWidth) + "px";
    host.insertBefore(acts, el);

  }

    var el = t.closest(o.item);

    if(open && open.el !== el){                               /* 点别处先收回；点的是另一条就只算收回 */

      if(!g.fromOpen && dx > 0){ g = null; return; }                                    /* 关着的往右滑没意义 */
      g.locked = true;

    }
    if(go){
      busy = true;
      S.sheet.style.transform = "translate3d(0," + Math.ceil(x.h + 24) + "px,0)";
      S.mask.style.backgroundColor = "rgba(12,16,22,0)";
      setTimeout(function(){ S.close(); reset(S); busy = false; }, 280);
    }else{
      S.sheet.style.transform = ""; S.mask.style.backgroundColor = "";
      timer = setTimeout(function(){ reset(S); }, 300);
    }
  }
  document.addEventListener("touchend", function(){ end(false); }, {passive:true});
  document.addEventListener("touchcancel", function(){ end(true); }, {passive:true});
  return { active: function(){ return !!(g && g.locked); } };
}

let drag = null;
const swipe = SwipeActions({
  root: $('list'), item: '.item[data-key]',
  blocked: function(){ return batchMode || anyOverlay() || (drag && drag.active()); },   // 按住等拿起时不算：横滑一出死区就取消长按（onLock）
  onLock: function(){ clearPress(); if (drag) drag.cancelHold(); },
  actions: function(el){
    const k = el.dataset.key, pinned = loadPinned().indexOf(k) >= 0;
    return [
      { label: '更多', icon: ICON.more, cls: 'lsw-more', onClick: function(){ openSubjectSheet(k); } },
      { label: pinned ? '取消置顶' : '置顶', icon: ICON.pin, cls: 'lsw-pin', onClick: function(){ togglePin(k); } },
    ];
  }
});
const sheetGesture = SheetDismiss({
  sheets: function(){ return sheetEl ? [{ mask: sheetEl.mask, sheet: sheetEl.sheet, close: closeSheet, dirty: sheetEl.dirty }] : []; },
  blocked: confirmOpen,
  confirmDiscard: function(){ tryCloseSheet(); }
});

/* ===================== 长按拖动排序（assets/drag.js v2，日程卡片用户真机满意的那版） ===================== */
// 同一层的科目卡片换位（置顶的、某个文件夹里的、没进文件夹的各是一层），长按文件夹标题整个文件夹换位。
// 跨文件夹移动走 📁 按钮（这版不做跨文件夹拖动，用户同意）
drag = LongPressDrag({
  enabled: function(){ return true; },
  blocked: function(){ return batchMode || anyOverlay() || swipe.isOpen() || swipe.active(); },
  scope: function(t){
    const list = $('list');
    if (t.closest('button')) return null;
    const item = t.closest('.item[data-key]');
    if (item && list.contains(item)) {
      const box = item.parentElement, pin = item.classList.contains('pinned');
      const items = Array.prototype.filter.call(box.children, function(x){ return x.matches('.item[data-key]') && x.classList.contains('pinned') === pin; });
      return items.length > 1 ? { item: item, box: box, items: items } : null;
    }
    const head = t.closest('.folder-card > .folder-header');
    if (head) {
      const items = Array.prototype.slice.call(list.querySelectorAll(':scope > .folder-card'));
      return items.length > 1 ? { item: head.parentElement, box: list, items: items } : null;
    }
    return null;
  },
  onBegin: function(){ clearPress(); swipe.close(false); closeMenu(); ptrCancel(); },
  commit: function(items){
    if (items[0].matches('.folder-card')) {
      const byId = {}; loadFolders().forEach(function(f){ byId[f.id] = f; });
      const next = items.map(function(s){ return byId[s.dataset.fid]; }).filter(Boolean);
      loadFolders().forEach(function(f){ if (next.indexOf(byId[f.id]) < 0) next.push(f); });
      saveFolders(next);
    } else {
      const keys = items.map(function(r){ return r.dataset.key; });
      if (items[0].classList.contains('pinned')) savePinned(keys);
      else reorderSubjects(keys);
    }
    render();
  },
  cancelled: function(){ if (renderPending) render(); },
  gap: function(box){ return parseFloat(getComputedStyle(box).rowGap) || 0; },
  keyOf: function(el){ return el.matches('.folder-card') ? 'f:' + el.dataset.fid : (el.dataset.key ? 'r:' + el.dataset.key : null); },
  find: function(k){
    const id = k.slice(2);
    return k.charAt(0) === 'f' ? $('list').querySelector('.folder-card[data-fid="' + CSS.escape(id) + '"]') : $('list').querySelector('.item[data-key="' + CSS.escape(id) + '"]');
  }
});

// 从科目页返回（含浏览器的「返回」从缓存里恢复）、切回这个标签页、别的标签页改了数据：重新读一遍学习情况
window.addEventListener('pageshow', function(e){ if (e.persisted) render(); });
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible' && !anyOverlay()) render(); });
window.addEventListener('storage', function(){ if (!anyOverlay()) render(); });

document.addEventListener('keydown', function(e){
  if (confirmOpen()) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('.confirm-box button')) return;   // 焦点在「取消」上按回车就是取消
    if (e.key === 'Escape') { $('confirmCancelBtn').click(); e.preventDefault(); }
    else if (e.key === 'Enter') { $('confirmOkBtn').click(); e.preventDefault(); }
    return;
  }
  if (e.key === 'Escape') {
    if (menuEl) { closeMenu(); $('topMoreBtn').focus(); e.preventDefault(); return; }
    if (sheetEl) { tryCloseSheet(); e.preventDefault(); return; }
    if (batchMode) { setBatch(false); e.preventDefault(); return; }
  }
  const b = e.target.closest && e.target.closest('[role="button"]');
  if (b && !b.closest('#list') && (e.key === 'Enter' || e.key === ' ')) { b.click(); e.preventDefault(); }
});

/* ===================== 备份：导出 / 导入 ===================== */
/* 错题本、练习记录只存在这个浏览器里。导出 = 把 8 科的数据装进一个文件；导入 = 合并回来（不覆盖已有的）。
   只认下面这张清单里的存储项，文件里别的东西一律不写。 */
const PER_SUBJECT = ['_wrongbook', '_wbremoved', '_history', '_done', '_inprogress', '_exammode', '_recite'];
function backupKeys() {
  const keys = [STORAGE_KEY, FOLDERS_KEY, SUBJECT_FOLDER_KEY, PINNED_KEY, ORDER_KEY];
  SUBJECTS.forEach(function(s){ PER_SUBJECT.forEach(function(suf){ keys.push(s.prefix + suf); }); });
  return keys;
}
function pad2(n) { return String(n).padStart(2, '0'); }
function renderLastExport() {
  const t = Number(readJSON(LAST_EXPORT_KEY, 0)) || 0, el = $('lastExport');
  if (!t) { el.textContent = '上次导出：从未'; return; }
  const day = function(x){ const d = new Date(x); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); };
  const n = Math.round((day(Date.now()) - day(t)) / 86400000);
  el.textContent = '上次导出：' + (n <= 0 ? '今天' : n === 1 ? '昨天' : n + ' 天前');
}
function exportBackup() {
  const items = {};
  let wrong = 0, hist = 0;
  backupKeys().forEach(function(k){
    let v = null; try { v = localStorage.getItem(k); } catch(e) {}
    if (v == null) return;
    items[k] = v;
    try { const j = JSON.parse(v); if (/_wrongbook$/.test(k) && j && typeof j === 'object') wrong += Object.keys(j).length; if (/_history$/.test(k) && Array.isArray(j)) hist += j.length; } catch(e) {}
  });
  if (!Object.keys(items).length) { notify('现在还没有任何数据可以导出'); return; }
  const d = new Date();
  const name = '刷题合集备份_' + d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + '.json';
  const blob = new Blob([JSON.stringify({ app: 'tiku', version: 1, exportedAt: d.getTime(), items: items })], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  try { localStorage.setItem(LAST_EXPORT_KEY, String(d.getTime())); } catch(e) {}
  renderLastExport();
  notify('已导出：' + wrong + ' 道错题、' + hist + ' 条练习记录');
}
function parseJSON(s, def) { try { const v = JSON.parse(s); return v == null ? def : v; } catch(e) { return def; } }
function isObj(v) { return !!v && typeof v === 'object' && !Array.isArray(v); }
// 合并规则：错题同一题留较新的那条；记录按时间去重后留最近 100 条；做过的题取并集；其余（进行中的练习、模式开关、自定义名字、分组、置顶和顺序）只在本机没有时才填
function mergeItem(key, incoming) {
  let cur = null; try { cur = localStorage.getItem(key); } catch(e) {}
  if (/_wrongbook$/.test(key)) {
    const a = parseJSON(cur, {}), b = parseJSON(incoming, null);
    if (!isObj(b)) return 0;
    const out = isObj(a) ? a : {}; let n = 0;
    // 本机已经移出过的题（连对 3 次、手动移出、清空），备份里那条比移出时间旧就不放回来
    const removed = parseJSON(localStorage.getItem(key.replace(/_wrongbook$/, '_wbremoved')), {});
    Object.keys(b).forEach(function(id){ const x = b[id]; if (!isObj(x)) return; if (isObj(removed) && (Number(removed[id]) || 0) >= (Number(x.lastWrongAt) || 0)) return; const old = out[id]; if (!isObj(old) || (Number(x.lastWrongAt) || 0) > (Number(old.lastWrongAt) || 0)) { out[id] = x; n++; } });
    return safeSet(key, out) ? n : 0;
  }
  if (/_history$/.test(key)) {
    const a = parseJSON(cur, []), b = parseJSON(incoming, null);
    if (!Array.isArray(b)) return 0;
    const seen = {}, out = []; let n = 0;
    (Array.isArray(a) ? a : []).forEach(function(h){ if (isObj(h) && !seen[h.date]) { seen[h.date] = 1; out.push(h); } });
    b.forEach(function(h){ if (isObj(h) && !seen[h.date]) { seen[h.date] = 1; out.push(h); n++; } });
    out.sort(function(x, y){ return (Number(y.date) || 0) - (Number(x.date) || 0); });
    return safeSet(key, out.slice(0, 100)) ? n : 0;
  }
  if (/_wbremoved$/.test(key)) {
    const a = parseJSON(cur, {}), b = parseJSON(incoming, null);
    if (!isObj(b)) return 0;
    const out = isObj(a) ? a : {};
    Object.keys(b).forEach(function(id){ if ((Number(b[id]) || 0) > (Number(out[id]) || 0)) out[id] = Number(b[id]); });
    safeSet(key, out); return 0;
  }
  if (/_done$/.test(key)) {
    const a = parseJSON(cur, {}), b = parseJSON(incoming, null);
    if (!isObj(b)) return 0;
    const out = isObj(a) ? a : {};
    Object.keys(b).forEach(function(k){ out[k] = 1; });
    safeSet(key, out); return 0;
  }
  if (cur == null) {
    if (/_exammode$|_recite$/.test(key)) { if (incoming === 'true' || incoming === 'false') { try { localStorage.setItem(key, incoming); } catch(e) {} } }
    else { const v = parseJSON(incoming, null); if (v != null) safeSet(key, v); }
  }
  return 0;
}
async function importBackup(file) {
  let text = '';
  try { text = await file.text(); } catch(e) { notify('这个文件读不出来'); return; }
  const data = parseJSON(text, null);
  if (!isObj(data) || data.app !== 'tiku' || !isObj(data.items)) { notify('这不是刷题合集导出的备份文件'); return; }
  const allowed = backupKeys();
  const keys = Object.keys(data.items).filter(function(k){ return allowed.indexOf(k) >= 0 && typeof data.items[k] === 'string'; });
  if (!keys.length) { notify('备份文件里没有可以导入的内容'); return; }
  let wrong = 0, hist = 0;
  keys.forEach(function(k){ const j = parseJSON(data.items[k], null); if (/_wrongbook$/.test(k) && isObj(j)) wrong += Object.keys(j).length; if (/_history$/.test(k) && Array.isArray(j)) hist += j.length; });
  const when = data.exportedAt ? new Date(Number(data.exportedAt)) : null;
  const whenText = when && !isNaN(when) ? (when.getFullYear() + '-' + pad2(when.getMonth() + 1) + '-' + pad2(when.getDate()) + ' 导出的') : '';
  if (!await showConfirm('这份备份' + (whenText ? '是 ' + whenText : '') + '，里面有 ' + wrong + ' 道错题、' + hist + ' 条练习记录。\n导入是「合并」：本机已有的不会被冲掉，同一道错题留较新的那条。\n确定导入吗？', '导入')) return;
  let addW = 0, addH = 0;
  keys.sort(function(x, y){ return (/_wbremoved$/.test(y) ? 1 : 0) - (/_wbremoved$/.test(x) ? 1 : 0); });   // 先合并移出记号，再合并错题本
  keys.forEach(function(k){ const n = mergeItem(k, data.items[k]); if (/_wrongbook$/.test(k)) addW += n; if (/_history$/.test(k)) addH += n; });
  render();
  notify('导入完成：新增或更新 ' + addW + ' 道错题、' + addH + ' 条练习记录');
}
$('exportBtn').addEventListener('click', exportBackup);
$('importBtn').addEventListener('click', function(){ $('importFile').click(); });
$('importFile').addEventListener('change', function(e){
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (f) importBackup(f);
});
/* 离线也能打开：只做"断网时用上次存下来的页面"（见 sw.js） */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
}

/* ===================== 下拉刷新 ===================== */
/* 配方：起手死区防误触 → 出死区后方向一锤定音 → 阈值按屏高推导（小屏上手指行程占比才不会偏重） */
let ptrCancel = function(){};
function setupPullToRefresh(){
  const el = $("ptrIndicator");
  if(!el) return;
  const DEADZONE = 16;    // 起手死区：按下瞬间手指会抖，这几像素不算下拉
  const DAMPING  = 0.42;  // 阻尼系数：手指位移 × 它 = 指示器位移
  const MAX_PULL = 120;   // 再往下拉指示器也不动了
  function threshold(){ return Math.min(100, Math.max(56, window.innerHeight * 0.1)); }

  let startX=0, startY=0, pulling=false, locked=false, distance=0, refreshing=false, tipTimer=null, unlockTimer=null;

  // 有浮层/正在操作时不接管手势（以后每加一个浮层，都要回来这里补一条）
  function blocked(){
    if(anyOverlay()) return true;                 // ⋯ 菜单、底部面板、确认框
    if(batchMode) return true;                    // 批量整理：底部操作条浮着，且刷新会丢掉勾选
    if(swipe.isOpen() || swipe.active()) return true;   // 有科目左滑开着
    if(drag.active()) return true;                // 长按拖动中（只是按住等拿起不算：一开始下拉就取消长按，见 touchmove）
    return false;
  }

  function paint(d){
    distance = d;
    el.classList.remove("ptr-animate");
    el.style.transform = "translateY(" + d + "px)";
    el.style.opacity = Math.min(1, d / (threshold() * 0.8));
    if(d >= threshold()) el.classList.add("ptr-ready"); else el.classList.remove("ptr-ready");
  }
  function reset(animate){
    distance = 0;
    if(animate) el.classList.add("ptr-animate"); else el.classList.remove("ptr-animate");
    el.style.transform = "translateY(0)";
    el.style.opacity = "0";
    el.classList.remove("ptr-ready","ptr-loading");
  }
  // 长按拿起科目那一刻：这次手势归拖动，下拉不再接管（只在 touchstart 查 blocked，拖着往下走会把刷新拉出来）
  ptrCancel = function(){ if(pulling && !refreshing){ pulling = false; locked = false; reset(true); } };
  function showTip(msg){
    const tip = $("ptrTip");
    if(!tip) return;
    tip.textContent = msg;
    tip.classList.add("show");
    clearTimeout(tipTimer);
    tipTimer = setTimeout(function(){ tip.classList.remove("show"); }, 1800);
  }
  function doRefresh(){
    // 断网时 location.reload() 会把整个应用变成浏览器错误页，
    // 所以离线时改成「重读本地数据 + 重绘」，视觉效果一样，也不会把人弄丢
    if(navigator.onLine === false){
      render();
      notify("当前没有网络，已重新载入本地数据");
      reset(true);
      refreshing = false;
      return;
    }
    try{ sessionStorage.setItem("ptr-fired", String(Date.now())); }catch(err){}
    location.reload();
  }

  document.addEventListener("touchstart", function(e){
    if(refreshing || blocked() || e.touches.length !== 1 || window.scrollY > 0){ pulling = false; return; }
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    pulling = true;
    locked = false;
  }, { passive:true });

  document.addEventListener("touchmove", function(e){
    // 刷新中锁住滚动：iOS Safari 发起重新加载后、新页面画出来之前会冻结绘制，
    // 这时还能滑，滑出来的区域是一片空白（下拉刷新配方 v1.8）
    if(refreshing){ e.preventDefault(); return; }
    if(!pulling) return;
    if(drag.active()){ ptrCancel(); return; }
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if(!locked){
      if(Math.abs(dy) < DEADZONE && Math.abs(dx) < DEADZONE) return;             // 还在死区，继续观察
      if(dy <= 0 || Math.abs(dx) > Math.abs(dy)){ pulling = false; return; }     // 上滑/横滑，这一次整个弃权
      locked = true;
      if(drag.holding()) drag.cancelHold();   // 开始下拉了，就不是长按
    }
    // 下拉到一半改主意往上滑：把控制权交还给页面，否则页面会卡住不动
    if(dy <= 0 || window.scrollY > 0){ pulling = false; locked = false; reset(true); return; }
    paint(Math.min((dy - DEADZONE) * DAMPING, MAX_PULL));
    e.preventDefault();
  }, { passive:false });

  document.addEventListener("touchend", function(){
    if(!pulling || !locked || refreshing){ pulling = false; locked = false; return; }
    pulling = false;
    locked = false;
    if(distance < threshold()){ reset(true); return; }
    refreshing = true;
    el.classList.add("ptr-animate","ptr-loading");
    el.style.transform = "translateY(" + threshold() + "px)";
    // 留一下 spinner 再动手，否则直接白屏像卡死
    setTimeout(doRefresh, 260);
    // 兜底：重新加载被取消或一直卡着时，10 秒后解锁，别让页面永远滑不动
    clearTimeout(unlockTimer);
    unlockTimer = setTimeout(function(){ if(refreshing){ refreshing = false; reset(true); } }, 10000);
  }, { passive:true });
  // 触摸被系统打断（来电、系统手势）：收回指示器、不触发刷新（不处理的话指示器会停在半空）
  document.addEventListener("touchcancel", function(){
    if(pulling && !refreshing){ pulling = false; locked = false; reset(true); }
  }, { passive:true });
}
setupPullToRefresh();
renderToolbar();
render();
