<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>刷题合集</title>
<style>
  :root{ --primary:#3b82f6; --primary-dark:#2563eb; --bg:#f3f4f6; --text:#1f2937; --muted:#6b7280; --border:#e5e7eb; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Microsoft YaHei",Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);}
  .app{max-width:760px;margin:0 auto;min-height:100vh;padding:0 14px;}
  header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:28px 16px;text-align:center;margin:0 -14px 16px;border-radius:0 0 16px 16px;position:relative;}
  header h1{margin:0;font-size:22px;}
  header p{margin:6px 0 0;font-size:13px;opacity:.85;}
  .list{display:flex;flex-direction:column;gap:12px;}
  .item{display:block;background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);text-decoration:none;color:var(--text);position:relative;}
  .item .name-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
  .item .name{font-size:17px;font-weight:bold;}
  .item .desc{font-size:13px;color:var(--muted);}
  .empty-note{font-size:12px;color:var(--muted);text-align:center;margin-top:24px;}

  /* 阻止点击编辑区跳转 */
  .name-row{pointer-events:none;}
  .icon-btn,.reset-btn,.name-input{pointer-events:auto;}

  /* 通用小图标按钮（重命名/移入文件夹/文件夹改名/删除文件夹），始终可见，触屏友好 */
  .icon-btn{
    background:none;border:none;cursor:pointer;
    min-width:36px;min-height:36px;
    display:inline-flex;align-items:center;justify-content:center;
    border-radius:6px;
    color:var(--muted);font-size:14px;line-height:1;
    flex-shrink:0;opacity:.6;touch-action:manipulation;
  }
  @media (hover:hover) and (pointer:fine) {
    .icon-btn:hover{color:var(--primary);background:#e0edff;opacity:1;}
    .icon-btn.danger:hover{color:#ef4444;background:#fee2e2;}
  }
  .icon-btn:active{color:var(--primary);background:#e0edff;opacity:1;}
  .icon-btn.danger:active{color:#ef4444;background:#fee2e2;}
  /* 移入文件夹图标固定放在卡片这一行的最右端，跟名字/改名图标分开 */
  .name-row .folder-btn{margin-left:auto;}

  /* 编辑状态输入框 */
  .name-input{
    font-size:17px;font-weight:bold;
    border:2px solid var(--primary);border-radius:6px;
    padding:1px 6px;outline:none;
    font-family:inherit;color:var(--text);background:#fff;
    min-width:80px;width:auto;
  }

  /* 重置按钮（已自定义名称时显示，不再依赖hover，触屏可直接点到） */
  .reset-btn{
    display:none;
    background:none;border:none;cursor:pointer;
    padding:2px 5px;border-radius:4px;
    color:#ef4444;font-size:11px;line-height:1.4;
    flex-shrink:0;margin-left:2px;opacity:.75;touch-action:manipulation;
  }
  @media (hover:hover) and (pointer:fine) {
    .reset-btn:hover{background:#fee2e2;opacity:1;}
  }
  .reset-btn:active{background:#fee2e2;opacity:1;}
  .reset-btn.visible{display:inline-flex;}

  /* 文件夹卡片 */
  .folder-card{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .folder-header{display:flex;align-items:center;gap:6px;padding:14px 16px;cursor:pointer;touch-action:manipulation;}
  .folder-header .chevron{font-size:11px;color:var(--muted);width:14px;flex-shrink:0;transition:transform .15s;}
  .folder-header .folder-icon{font-size:16px;flex-shrink:0;}
  .folder-header .folder-name{
    font-size:16px;font-weight:bold;
    min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .folder-header .folder-count{font-size:13px;color:var(--muted);flex-shrink:0;}
  .folder-header .icon-btn:first-of-type{margin-left:auto;}
  .folder-body{display:flex;flex-direction:column;gap:10px;padding:10px 12px 14px;background:#f8f9fb;border-radius:0 0 10px 10px;}
  .folder-body .item{border:1px solid var(--border);}
  .folder-empty-note{font-size:12px;color:var(--muted);text-align:center;padding:10px 0;}

  /* 移入文件夹 - 下拉菜单 */
  .item-menu{
    position:absolute;right:10px;top:44px;z-index:20;
    background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);
    min-width:170px;display:flex;flex-direction:column;padding:6px;
  }
  .menu-row{padding:12px 14px;font-size:13px;cursor:pointer;border-radius:6px;touch-action:manipulation;color:var(--text);}
  @media (hover:hover) and (pointer:fine) {
    .menu-row:hover{background:#f3f4f6;}
  }
  .menu-row:active{background:#f3f4f6;}
  .menu-row.accent{color:var(--primary);font-weight:bold;}
  .menu-row.danger{color:#ef4444;}
  .item-menu .menu-input{
    font-size:14px;border:1.5px solid var(--primary);border-radius:6px;
    padding:8px 10px;outline:none;margin:4px;font-family:inherit;
    color:var(--text);background:#fff;
  }
  .item-menu .menu-confirm-btn{
    background:var(--primary);color:#fff;border:none;border-radius:6px;
    padding:8px 10px;margin:0 4px 4px;font-size:13px;cursor:pointer;
  }

  /* 批量整理：钉在标题栏右下角，不参与文字排版，标题/副标题永远保持真正居中 */
  .toolbar-btn{
    position:absolute;right:6px;bottom:12px;
    background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;
    border-radius:7px;padding:6px 8px;font-size:11px;cursor:pointer;touch-action:manipulation;
    backdrop-filter:blur(2px);min-height:28px;white-space:nowrap;
  }
  @media (hover:hover) and (pointer:fine) {
    .toolbar-btn:hover{background:rgba(255,255,255,.3);}
  }
  .toolbar-btn:active{background:rgba(255,255,255,.3);}

  .item.batch-active .icon-btn,.item.batch-active .reset-btn{display:none !important;}
  .item.batch-selected{border:2px solid var(--primary);background:#eef2ff;}
  .folder-card.batch-active .icon-btn{display:none !important;}

  .batch-checkbox{
    width:20px;height:20px;border:2px solid var(--border);border-radius:5px;
    flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:13px;color:#fff;margin-right:2px;
  }
  .batch-checkbox.checked{background:var(--primary);border-color:var(--primary);}

  .batch-bar{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(16px + env(safe-area-inset-bottom));
    max-width:730px;width:calc(100% - 28px);
    background:#1f2937;color:#fff;border-radius:12px;padding:12px 16px;
    display:none;align-items:center;justify-content:space-between;gap:10px;
    box-shadow:0 4px 20px rgba(0,0,0,.25);z-index:30;
  }
  .batch-bar-btn{
    background:#fff;color:#1f2937;border:none;border-radius:8px;
    padding:9px 14px;font-size:13px;font-weight:bold;cursor:pointer;touch-action:manipulation;
    min-height:36px;
  }
  .batch-bar-btn.cancel{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);}
  .batch-bar .item-menu{position:absolute;left:16px;right:16px;bottom:56px;top:auto;min-width:0;}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>刷题合集</h1>
    <p>各科目练习题网站入口 · 持续更新</p>
    <button class="toolbar-btn" id="batchToggleBtn" type="button">📋 批量整理</button>
  </header>
  <div class="list" id="list"></div>
  <div class="empty-note">以后新增科目会持续加在这里</div>
</div>

<div class="batch-bar" id="batchBar">
  <span id="batchCount"></span>
  <div style="display:flex;gap:8px;">
    <button class="batch-bar-btn" id="batchMoveBtn" type="button">移动到文件夹 ▾</button>
    <button class="batch-bar-btn cancel" id="batchCancelBtn" type="button">取消</button>
  </div>
</div>

<script>
const SUBJECTS = [
  { key:'web-design',         href:'./web-design/',          defaultName:'WEB程序设计',           desc:'单选+填空混合，90题 · 错题本 / 练习记录 / 题目总览' },
  { key:'os',                 href:'./os/',                  defaultName:'操作系统',               desc:'填空题，85题 · 错题本 / 练习记录 / 题目总览' },
  { key:'software-engineering',href:'./software-engineering/',defaultName:'软件工程',              desc:'单选+填空混合，156题（6章节填空+6套模拟题） · 错题本 / 练习记录 / 题目总览' },
  { key:'mobile-app',         href:'./mobile-app/',          defaultName:'移动应用开发',           desc:'单选题，10题（第1次+第2次作业） · 错题本 / 练习记录 / 题目总览' },
  { key:'english-listening',  href:'./english-listening/',   defaultName:'大学英语听力',           desc:'单选题，120题（六单元各20题） · 错题本 / 练习记录 / 题目总览' },
  { key:'english-reading',    href:'./english-reading/',     defaultName:'大学英语阅读与选词填空', desc:'填空+单选混合，66题（六单元：选词填空6篇每篇10空＋阅读理解60题） · 错题本 / 练习记录 / 题目总览' },
  { key:'english-vocab',      href:'./english-vocab/',       defaultName:'大学英语课后选词填空',   desc:'填空题，6题共93空（六单元课后例句选词，含词表） · 错题本 / 练习记录 / 题目总览' },
  { key:'english-translation',href:'./english-translation/', defaultName:'大学英语汉译英翻译练习', desc:'翻译题，48题（六单元各8句，汉译英，关键词判分＋完整参考译文） · 错题本 / 练习记录 / 题目总览' },
];

const STORAGE_KEY = 'tiku_custom_names';
const FOLDERS_KEY = 'tiku_folders';
const SUBJECT_FOLDER_KEY = 'tiku_subject_folder';

// 当前页面会话内的"文件夹展开"状态（不持久化，符合"默认折叠"设计）
const expandedFolders = new Set();
// 当前打开的移入文件夹下拉菜单
let openMenu = null;
// 当前正在编辑（重命名）的输入框，科目卡片/文件夹改名时用来判断"点击别处应该只退出编辑，不触发下面的跳转/其他动作"
let activeRenameInput = null;
// 点击输入框外部时，浏览器会在mousedown阶段就让输入框失焦(从而在click事件到达之前就已经把activeRenameInput清空、href也已恢复)，
// 所以必须在mousedown阶段（比click更早）就记下"这一次点击应该被吞掉"，否则click阶段已经判断不出刚才是不是在重命名了
let suppressRenameClick = false;
// 批量整理模式状态
let batchMode = false;
const batchSelected = new Set();

function loadNames() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { return {}; }
}
function saveName(key, name) {
  const names = loadNames();
  names[key] = name;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(names));
}
function deleteName(key) {
  const names = loadNames();
  delete names[key];
  localStorage.setItem(STORAGE_KEY, JSON.stringify(names));
}

function loadFolders() {
  try { return JSON.parse(localStorage.getItem(FOLDERS_KEY) || '[]'); } catch(e) { return []; }
}
function saveFolders(folders) {
  localStorage.setItem(FOLDERS_KEY, JSON.stringify(folders));
}
function loadSubjectFolderMap() {
  try { return JSON.parse(localStorage.getItem(SUBJECT_FOLDER_KEY) || '{}'); } catch(e) { return {}; }
}
function saveSubjectFolderMap(map) {
  localStorage.setItem(SUBJECT_FOLDER_KEY, JSON.stringify(map));
}

function closeOpenMenu() {
  if (openMenu && openMenu.parentNode) openMenu.parentNode.removeChild(openMenu);
  openMenu = null;
}

document.addEventListener('click', function(e) {
  if (openMenu && !openMenu.contains(e.target) && !e.target.closest('.folder-btn') && !e.target.closest('#batchMoveBtn')) {
    closeOpenMenu();
  }
});

// 用捕获阶段的mousedown先于失焦事件记下"点击的是外部"，再用捕获阶段的click吞掉这次点击，
// 避免重命名输入框失焦提交之后，同一次点击继续被卡片的<a href>当成正常导航跳转进题库
document.addEventListener('mousedown', function(e) {
  if (activeRenameInput && !activeRenameInput.contains(e.target)) {
    suppressRenameClick = true;
  }
}, true);

document.addEventListener('click', function(e) {
  if (suppressRenameClick) {
    suppressRenameClick = false;
    e.preventDefault();
    e.stopPropagation();
  }
}, true);

function buildList() {
  openMenu = null; // 即将整体重建列表，旧菜单节点会被一起清掉
  activeRenameInput = null; // 旧的编辑框节点也会被一起清掉
  const names = loadNames();
  const folders = loadFolders();
  const subjectFolderMap = loadSubjectFolderMap();
  const list = document.getElementById('list');
  list.innerHTML = '';

  const grouped = {};
  const ungrouped = [];
  SUBJECTS.forEach(function(subj) {
    const fid = subjectFolderMap[subj.key];
    if (fid && folders.some(function(f){ return f.id === fid; })) {
      (grouped[fid] = grouped[fid] || []).push(subj);
    } else {
      ungrouped.push(subj);
    }
  });

  folders.forEach(function(folder) {
    list.appendChild(buildFolderCard(folder, grouped[folder.id] || [], names));
  });

  ungrouped.forEach(function(subj) {
    list.appendChild(buildSubjectItem(subj, names));
  });

  renderBatchBar();
}

function renderToolbar() {
  document.getElementById('batchToggleBtn').textContent = batchMode ? '✕ 退出整理模式' : '📋 批量整理';
}

function renderBatchBar() {
  const bar = document.getElementById('batchBar');
  if (!batchMode) {
    bar.style.display = 'none';
    return;
  }
  bar.style.display = 'flex';
  document.getElementById('batchCount').textContent = '已选 ' + batchSelected.size + ' 项';
}

function buildSubjectItem(subj, names) {
  const customName = names[subj.key];
  const displayName = customName || subj.defaultName;
  const isCustom = !!customName;

  const a = document.createElement('a');
  a.className = 'item';
  a.href = subj.href;

  const nameRow = document.createElement('div');
  nameRow.className = 'name-row';

  if (batchMode) {
    const isSelected = batchSelected.has(subj.key);
    a.classList.add('batch-active');
    if (isSelected) a.classList.add('batch-selected');
    const checkbox = document.createElement('span');
    checkbox.className = 'batch-checkbox' + (isSelected ? ' checked' : '');
    checkbox.textContent = isSelected ? '✓' : '';
    nameRow.appendChild(checkbox);
  }

  const nameSpan = document.createElement('span');
  nameSpan.className = 'name';
  nameSpan.textContent = displayName;

  const renameBtn = document.createElement('button');
  renameBtn.className = 'icon-btn';
  renameBtn.title = '重命名';
  renameBtn.innerHTML = '✏️';

  const resetBtn = document.createElement('button');
  resetBtn.className = 'reset-btn' + (isCustom ? ' visible' : '');
  resetBtn.title = '恢复原名';
  resetBtn.textContent = '还原';

  const folderBtn = document.createElement('button');
  folderBtn.className = 'icon-btn folder-btn';
  folderBtn.title = '移入文件夹';
  folderBtn.innerHTML = '📁';

  const desc = document.createElement('div');
  desc.className = 'desc';
  desc.textContent = subj.desc;

  nameRow.appendChild(nameSpan);
  nameRow.appendChild(renameBtn);
  nameRow.appendChild(resetBtn);
  nameRow.appendChild(folderBtn);
  a.appendChild(nameRow);
  a.appendChild(desc);

  renameBtn.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    startEdit(subj, nameSpan, renameBtn, resetBtn);
  });

  resetBtn.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    deleteName(subj.key);
    nameSpan.textContent = subj.defaultName;
    resetBtn.classList.remove('visible');
  });

  folderBtn.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    toggleSubjectMenu(subj, a);
  });

  a.addEventListener('click', function(e) {
    // 正在重命名/有移入文件夹菜单打开时，点击卡片（包括正在编辑的这张卡片自己）只应退出该状态，不跳转进题库
    if (activeRenameInput || openMenu) {
      e.preventDefault();
      e.stopPropagation();
      if (activeRenameInput) activeRenameInput.blur();
      if (openMenu) closeOpenMenu();
      return;
    }
    if (!batchMode) return;
    e.preventDefault();
    if (batchSelected.has(subj.key)) batchSelected.delete(subj.key);
    else batchSelected.add(subj.key);
    buildList();
  });

  return a;
}

function startEdit(subj, nameSpan, renameBtn, resetBtn) {
  const currentText = nameSpan.textContent;

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'name-input';
  input.value = currentText;
  input.style.width = Math.max(currentText.length * 18, 120) + 'px';

  const a = nameSpan.closest('a');
  const savedHref = a.getAttribute('href');
  a.removeAttribute('href');

  nameSpan.replaceWith(input);
  renameBtn.style.display = 'none';
  input.focus();
  input.select();
  activeRenameInput = input;

  input.addEventListener('click', function(e) { e.stopPropagation(); });
  input.addEventListener('mousedown', function(e) { e.stopPropagation(); });

  function commit() {
    if (activeRenameInput === input) activeRenameInput = null;
    const newName = input.value.trim();
    const finalName = newName || subj.defaultName;
    nameSpan.textContent = finalName;
    input.replaceWith(nameSpan);
    renameBtn.style.display = '';
    a.setAttribute('href', savedHref);
    if (finalName !== subj.defaultName) {
      saveName(subj.key, finalName);
      resetBtn.classList.add('visible');
    } else {
      deleteName(subj.key);
      resetBtn.classList.remove('visible');
    }
  }

  input.addEventListener('blur', commit);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { input.value = currentText; input.blur(); }
  });
}

// ---- 移入文件夹：下拉菜单 ----
function toggleSubjectMenu(subj, itemEl) {
  if (openMenu && openMenu.dataset.forKey === subj.key) {
    closeOpenMenu();
    return;
  }
  closeOpenMenu();

  const folders = loadFolders();
  const map = loadSubjectFolderMap();
  const currentFid = map[subj.key];

  const menu = document.createElement('div');
  menu.className = 'item-menu';
  menu.dataset.forKey = subj.key;
  menu.addEventListener('click', function(e) { e.stopPropagation(); });

  folders.forEach(function(f) {
    const row = document.createElement('div');
    row.className = 'menu-row';
    row.textContent = '📁 ' + f.name;
    row.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      const m = loadSubjectFolderMap();
      m[subj.key] = f.id;
      saveSubjectFolderMap(m);
      expandedFolders.add(f.id);
      closeOpenMenu();
      buildList();
    });
    menu.appendChild(row);
  });

  if (currentFid) {
    const row = document.createElement('div');
    row.className = 'menu-row danger';
    row.textContent = '📤 移出文件夹';
    row.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      const m = loadSubjectFolderMap();
      delete m[subj.key];
      saveSubjectFolderMap(m);
      closeOpenMenu();
      buildList();
    });
    menu.appendChild(row);
  }

  const newRow = document.createElement('div');
  newRow.className = 'menu-row accent';
  newRow.textContent = '➕ 新建文件夹...';
  newRow.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    renderNewFolderInput(menu, subj);
  });
  menu.appendChild(newRow);

  itemEl.appendChild(menu);
  openMenu = menu;
}

function renderNewFolderInput(menu, subj) {
  menu.innerHTML = '';

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'menu-input';
  input.placeholder = '文件夹名称';

  const btn = document.createElement('button');
  btn.className = 'menu-confirm-btn';
  btn.textContent = '创建';

  menu.appendChild(input);
  menu.appendChild(btn);

  function commit() {
    const name = input.value.trim();
    if (!name) { closeOpenMenu(); return; }
    const folders = loadFolders();
    const newFolder = { id: 'f_' + Date.now(), name: name };
    folders.push(newFolder);
    saveFolders(folders);
    const map = loadSubjectFolderMap();
    map[subj.key] = newFolder.id;
    saveSubjectFolderMap(map);
    expandedFolders.add(newFolder.id);
    closeOpenMenu();
    buildList();
  }

  input.addEventListener('click', function(e) { e.stopPropagation(); });
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    if (e.key === 'Escape') { closeOpenMenu(); }
  });
  btn.addEventListener('click', function(e) { e.preventDefault(); e.stopPropagation(); commit(); });
  input.focus();
}

// ---- 文件夹卡片 ----
function buildFolderCard(folder, members, names) {
  const card = document.createElement('div');
  card.className = 'folder-card' + (batchMode ? ' batch-active' : '');

  const header = document.createElement('div');
  header.className = 'folder-header';

  const isExpanded = expandedFolders.has(folder.id);

  const chevron = document.createElement('span');
  chevron.className = 'chevron';
  chevron.textContent = isExpanded ? '▼' : '▶';

  const icon = document.createElement('span');
  icon.className = 'folder-icon';
  icon.textContent = '📁';

  const nameSpan = document.createElement('span');
  nameSpan.className = 'folder-name';
  nameSpan.textContent = folder.name;

  const countSpan = document.createElement('span');
  countSpan.className = 'folder-count';
  countSpan.textContent = '(' + members.length + ')';

  const renameBtn = document.createElement('button');
  renameBtn.className = 'icon-btn';
  renameBtn.title = '重命名文件夹';
  renameBtn.innerHTML = '✏️';

  const deleteBtn = document.createElement('button');
  deleteBtn.className = 'icon-btn danger';
  deleteBtn.title = '删除文件夹';
  deleteBtn.innerHTML = '🗑️';

  header.appendChild(chevron);
  header.appendChild(icon);
  header.appendChild(nameSpan);
  header.appendChild(countSpan);
  header.appendChild(renameBtn);
  header.appendChild(deleteBtn);

  const body = document.createElement('div');
  body.className = 'folder-body';
  body.style.display = isExpanded ? 'flex' : 'none';

  if (members.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'folder-empty-note';
    empty.textContent = '空文件夹，从科目卡片的📁按钮把科目移进来';
    body.appendChild(empty);
  } else {
    members.forEach(function(subj) {
      body.appendChild(buildSubjectItem(subj, names));
    });
  }

  header.addEventListener('click', function() {
    if (expandedFolders.has(folder.id)) expandedFolders.delete(folder.id);
    else expandedFolders.add(folder.id);
    buildList();
  });

  renameBtn.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    startFolderRename(folder, nameSpan);
  });

  deleteBtn.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    const confirmMsg = '确定要删除文件夹"' + folder.name + '"吗？\n文件夹里的科目不会被删除，只会移回未分类列表。';
    if (!window.confirm(confirmMsg)) return;
    const remaining = loadFolders().filter(function(f) { return f.id !== folder.id; });
    saveFolders(remaining);
    const map = loadSubjectFolderMap();
    Object.keys(map).forEach(function(k) {
      if (map[k] === folder.id) delete map[k];
    });
    saveSubjectFolderMap(map);
    expandedFolders.delete(folder.id);
    buildList();
  });

  card.appendChild(header);
  card.appendChild(body);
  return card;
}

function startFolderRename(folder, nameSpan) {
  const currentText = folder.name;

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'name-input';
  input.value = currentText;
  input.style.width = Math.max(currentText.length * 18, 100) + 'px';

  nameSpan.replaceWith(input);
  input.focus();
  input.select();
  activeRenameInput = input;
  input.addEventListener('click', function(e) { e.stopPropagation(); });
  input.addEventListener('mousedown', function(e) { e.stopPropagation(); });

  function commit() {
    if (activeRenameInput === input) activeRenameInput = null;
    const newName = input.value.trim() || currentText;
    const folders = loadFolders();
    const target = folders.find(function(f) { return f.id === folder.id; });
    if (target) {
      target.name = newName;
      saveFolders(folders);
    }
    buildList();
  }

  input.addEventListener('blur', commit);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { input.value = currentText; input.blur(); }
  });
}

// ---- 批量整理：把多个已勾选科目一次性移动到某个文件夹 ----
function applyBatchMove(folderId) {
  const map = loadSubjectFolderMap();
  batchSelected.forEach(function(key) {
    if (folderId) map[key] = folderId;
    else delete map[key];
  });
  saveSubjectFolderMap(map);
  if (folderId) expandedFolders.add(folderId);
  batchMode = false;
  batchSelected.clear();
  closeOpenMenu();
  renderToolbar();
  buildList();
}

function toggleBatchMoveMenu() {
  if (batchSelected.size === 0) return;
  closeOpenMenu();

  const folders = loadFolders();
  const map = loadSubjectFolderMap();
  const anyInFolder = Array.from(batchSelected).some(function(key) { return !!map[key]; });
  const menu = document.createElement('div');
  menu.className = 'item-menu';
  menu.addEventListener('click', function(e) { e.stopPropagation(); });

  folders.forEach(function(f) {
    const row = document.createElement('div');
    row.className = 'menu-row';
    row.textContent = '📁 ' + f.name;
    row.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      applyBatchMove(f.id);
    });
    menu.appendChild(row);
  });

  if (anyInFolder) {
    const outRow = document.createElement('div');
    outRow.className = 'menu-row danger';
    outRow.textContent = '📤 移出文件夹';
    outRow.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      applyBatchMove(null);
    });
    menu.appendChild(outRow);
  }

  const newRow = document.createElement('div');
  newRow.className = 'menu-row accent';
  newRow.textContent = '➕ 新建文件夹...';
  newRow.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    renderBatchNewFolderInput(menu);
  });
  menu.appendChild(newRow);

  document.getElementById('batchBar').appendChild(menu);
  openMenu = menu;
}

function renderBatchNewFolderInput(menu) {
  menu.innerHTML = '';

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'menu-input';
  input.placeholder = '文件夹名称';

  const btn = document.createElement('button');
  btn.className = 'menu-confirm-btn';
  btn.textContent = '创建';

  menu.appendChild(input);
  menu.appendChild(btn);

  function commit() {
    const name = input.value.trim();
    if (!name) { closeOpenMenu(); return; }
    const folders = loadFolders();
    const newFolder = { id: 'f_' + Date.now(), name: name };
    folders.push(newFolder);
    saveFolders(folders);
    applyBatchMove(newFolder.id);
  }

  input.addEventListener('click', function(e) { e.stopPropagation(); });
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    if (e.key === 'Escape') { closeOpenMenu(); }
  });
  btn.addEventListener('click', function(e) { e.preventDefault(); e.stopPropagation(); commit(); });
  input.focus();
}

document.getElementById('batchToggleBtn').addEventListener('click', function() {
  batchMode = !batchMode;
  if (!batchMode) batchSelected.clear();
  renderToolbar();
  buildList();
});

document.getElementById('batchCancelBtn').addEventListener('click', function() {
  batchMode = false;
  batchSelected.clear();
  renderToolbar();
  buildList();
});

document.getElementById('batchMoveBtn').addEventListener('click', function(e) {
  e.preventDefault();
  e.stopPropagation();
  toggleBatchMoveMenu();
});

renderToolbar();
buildList();
</script>
</body>
</html>
